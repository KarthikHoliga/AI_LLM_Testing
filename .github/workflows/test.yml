name: AI/LLM Test Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest deepeval

    - name: Run Lab 01 (Pytest Basics)
      run: |
        python -m pytest 01_pytest_basics/test_agent_sim.py -v

    - name: Run Lab 02 & 03 (DeepEval, Security & Red-Teaming)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python -m pytest 02_deepeval_metrics/test_refund.py -v
        python -m pytest 03_security_redteaming/test_prompt_injection.py -v
        python -m pytest 03_security_redteaming/generate_redteam_attacks.py -v
